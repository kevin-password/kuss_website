{% extends 'base.html' %}
{% block title %}Email Test - KUSS{% endblock %}

{% block content %}
<section class="page-header">
    <h1><i class="fa-solid fa-flask"></i> Email Test Page (EmailJS SMTP)</h1>
    <p>Test if EmailJS SMTP works from your browser</p>
</section>

<section class="section container">
    <div style="max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: var(--shadow);">
        
        <div style="background: #e3f2fd; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #2196f3;">
            <p style="margin: 0; color: #1565c0;">
                <strong>ℹ️ Using EmailJS SMTP</strong> - Direct Gmail SMTP connection
            </p>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; color: var(--navy); margin-bottom: 8px;">
                Your Email Address *
            </label>
            <input type="email" id="testEmail" required 
                   value="tumusiimekevin3@gmail.com"
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;"
                   placeholder="your@email.com">
        </div>
        
        <button onclick="sendTestEmail()" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;" id="testBtn">
            <i class="fa-solid fa-paper-plane"></i> Send Test Email via SMTP
        </button>
        
        <div id="result" style="margin-top: 20px; padding: 15px; border-radius: 6px; display: none;"></div>
        
        <div id="debugLog" style="margin-top: 20px; background: #1e1e1e; color: #0f0; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;">
            <div style="color: #888;">Debug log will appear here...</div>
        </div>
    </div>
</section>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
// EmailJS Configuration - SMTP Service
const EMAILJS_PUBLIC_KEY = '1zMWIopNfq1nkwwxB';
const EMAILJS_SERVICE_ID = 'service_7w2ytzv';  // NEW SMTP Service
const EMAILJS_TEMPLATE_ID = 'template_h2ubueh';

// Initialize EmailJS
(function() {
    emailjs.init({
        publicKey: EMAILJS_PUBLIC_KEY,
    });
})();

function debugLog(message, type = 'info') {
    const log = document.getElementById('debugLog');
    const colors = { info: '#0f0', success: '#4caf50', error: '#f44336', warning: '#ff9800' };
    const time = new Date().toLocaleTimeString();
    log.innerHTML += `<div style="color: ${colors[type]};">[${time}] ${message}</div>`;
    log.scrollTop = log.scrollHeight;
}

async function sendTestEmail() {
    const email = document.getElementById('testEmail').value.trim();
    const btn = document.getElementById('testBtn');
    const result = document.getElementById('result');
    
    if (!email) {
        alert('Please enter an email address');
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
    result.style.display = 'none';
    
    debugLog(`Starting test email to: ${email}`, 'info');
    debugLog(`Using SMTP Service: ${EMAILJS_SERVICE_ID}`, 'info');
    debugLog(`Using Template: ${EMAILJS_TEMPLATE_ID}`, 'info');
    
    const templateParams = {
        to_email: email,
        from_name: 'KUSS Test System',
        subject: '🧪 KUSS Email Test (SMTP)',
        first_name: 'Test User',
        email: email,
        password: 'TEST_PASSWORD_123',
        payment_instructions: 'This is a test email. No payment required.',
        treasurer_name: 'Test Treasurer',
        treasurer_phone: '+256 700 000 000',
        contact_email: 'kabsurgicalsociety@gmail.com'
    };
    
    debugLog(`Template params prepared`, 'info');
    
    try {
        debugLog('Sending via EmailJS SMTP...', 'info');
        
        const response = await emailjs.send(
            EMAILJS_SERVICE_ID,
            EMAILJS_TEMPLATE_ID,
            templateParams
        );
        
        debugLog(`✅ EmailJS response status: ${response.status}`, 'success');
        debugLog(`✅ EmailJS response text: ${response.text}`, 'success');
        
        if (response.status === 200) {
            result.style.display = 'block';
            result.style.background = '#e8f5e9';
            result.style.color = '#2e7d32';
            result.innerHTML = '<i class="fa-solid fa-check-circle"></i> ✅ <strong>Success!</strong> Email sent via SMTP. Check your inbox (should arrive in 1-2 minutes).';
            debugLog('✅ EMAIL SENT SUCCESSFULLY VIA SMTP!', 'success');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Sent! Send Another';
        } else {
            throw new Error(`Unexpected status: ${response.status}`);
        }
        
    } catch (error) {
        debugLog(`❌ ERROR: ${error.text || error.message}`, 'error');
        debugLog(`Error status: ${error.status || 'unknown'}`, 'error');
        
        result.style.display = 'block';
        result.style.background = '#ffebee';
        result.style.color = '#c62828';
        result.innerHTML = `<i class="fa-solid fa-exclamation-circle"></i> ❌ <strong>Failed:</strong> ${error.text || error.message}<br><small>Check debug log below for details.</small>`;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Try Again';
    }
    
    btn.disabled = false;
}
</script>
{% endblock %}
